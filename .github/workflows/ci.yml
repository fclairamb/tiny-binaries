name: ci

# Builds and tests every binary on real hardware: GitHub's x86_64 and arm64 Linux runners
# (native kernels, no emulation) and an Apple Silicon macOS runner.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/${{ matrix.arch }}
          tags: tiny-binaries:${{ matrix.arch }}
          load: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Build and test
        run: scripts/run.sh -p linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.arch }}
          path: out/linux-${{ matrix.arch }}

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - name: Install toolchains
        run: |
          brew install vlang upx lld
          gh release download v0.43.0 -R tinygo-org/tinygo -p 'tinygo0.43.0.darwin-arm64.tar.gz' -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/tinygo0.43.0.darwin-arm64.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/tinygo/bin" >> "$GITHUB_PATH"
          rustup toolchain install stable nightly-2026-10-20 --profile minimal --component rust-src
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build and test
        run: scripts/run.sh -p darwin-arm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darwin-arm64
          path: out/darwin-arm64
